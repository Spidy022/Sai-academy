[project]
name = "sai-academy-backend"
version = "0.1.0"
description = "Sai Police Academy FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.6",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
